<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猜歌卡片掃描</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f2f2f2;--accent:#1db954;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f0f0f0;--card:#242424}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f0f0f0;--card:#242424}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC",sans-serif;max-width:520px;margin-inline:auto}
h1{font-size:20px}
button,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #8886}
button{background:var(--accent);color:#000;border:0;cursor:pointer}
input{width:100%;box-sizing:border-box;background:var(--card);color:var(--fg);margin:6px 0}
.box{background:var(--card);border-radius:12px;padding:12px;margin:12px 0}
video{width:100%;border-radius:8px;display:none;background:#000;margin-top:8px}
#msg{min-height:1.4em;font-size:15px}
</style>
</head>
<body>
<h1>🎵 猜歌卡片掃描</h1>

<div class="box" id="authBox"></div>

<div class="box">
  <button id="scanBtn">開啟鏡頭掃描 QR code</button>
  <video id="video" playsinline muted></video>
  <canvas id="canvas" hidden></canvas>
</div>

<div id="msg"></div>
<div id="info" class="box" hidden></div>

<div class="box">
  <div>掃不到時，可以貼 Spotify 歌曲連結測試：</div>
  <input id="link" placeholder="https://open.spotify.com/track/…">
  <button id="playBtn">播放</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const CLIENT_ID = "363209014a5b4083a42c931a67e4d726";
const REDIRECT = "https://asowes12546.github.io/songcards/";
const SCOPES = "user-modify-playback-state user-read-playback-state";
// 自訂歌單：以 Spotify 曲目 ID 為鍵，例如 "曲目ID": {title:"歌名", artist:"歌手", year:1998}
const SONGS = {};

const $ = id => document.getElementById(id);
const msg = t => $("msg").textContent = t;
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------- Spotify 授權（PKCE，不需要後端） ---------- */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function login(){
  const verifier = b64u(crypto.getRandomValues(new Uint8Array(48)));
  store.set("verifier", verifier);
  const challenge = b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({client_id:CLIENT_ID, response_type:"code", redirect_uri:REDIRECT,
    scope:SCOPES, code_challenge_method:"S256", code_challenge:challenge});
  location.href = "https://accounts.spotify.com/authorize?" + p;
}

async function tokenReq(params){
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CLIENT_ID, ...params})
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.error || r.status);
  store.set("at", j.access_token);
  store.set("exp", String(Date.now() + j.expires_in*1000 - 60000));
  if(j.refresh_token) store.set("rt", j.refresh_token);
}

async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  if(!code && !err) return;
  history.replaceState(null, "", REDIRECT);
  if(err){ msg("授權失敗：" + err); return; }
  try{
    await tokenReq({grant_type:"authorization_code", code, redirect_uri:REDIRECT,
      code_verifier:store.get("verifier") || ""});
  }catch(e){ msg("登入失敗：" + e.message); }
}

async function getToken(){
  if(!store.get("at")) return null;
  if(Date.now() > Number(store.get("exp") || 0)){
    const rt = store.get("rt");
    if(!rt) return null;
    try{ await tokenReq({grant_type:"refresh_token", refresh_token:rt}); }catch(e){ return null; }
  }
  return store.get("at");
}

function renderAuth(){
  const ok = !!store.get("at");
  $("authBox").innerHTML = ok ? "✅ 已連接 Spotify" : '<button id="loginBtn">連接 Spotify</button>';
  if(!ok) $("loginBtn").onclick = login;
}

/* ---------- 播放 ---------- */
async function spot(path, opt){
  const t = await getToken();
  if(!t) throw new Error("auth");
  return fetch("https://api.spotify.com/v1" + path,
    {...opt, headers:{Authorization:"Bearer " + t, "Content-Type":"application/json"}});
}

async function playTrack(id){
  const body = JSON.stringify({uris:["spotify:track:" + id], position_ms:0});
  let r;
  try{ r = await spot("/me/player/play", {method:"PUT", body}); }
  catch(e){ msg("請先按「連接 Spotify」。"); renderAuth(); return; }

  if(r.status === 404){
    // 沒有使用中的裝置：改找手機上的 Spotify APP 來播
    let list = [];
    try{ list = (await (await spot("/me/player/devices")).json()).devices || []; }catch(e){}
    const dev = list.find(x => x.type === "Smartphone") || list[0];
    if(!dev){ msg("找不到 Spotify 裝置。請先打開手機的 Spotify APP，隨便播一首歌，再重新掃描。"); return; }
    r = await spot("/me/player/play?device_id=" + dev.id, {method:"PUT", body});
  }
  if(r.ok){ msg("播放中 ▶"); return; }
  let detail = "";
  try{ detail = (await r.json()).error.message || ""; }catch(e){}
  if(r.status === 401) msg("登入已失效，請重新按「連接 Spotify」。");
  else if(r.status === 403) msg("Spotify 拒絕了這個請求（" + detail + "）。請確認帳號是 Premium，且已加入 User Management。");
  else if(r.status === 429) msg("請求太頻繁，請稍等幾秒再掃。");
  else msg("播放失敗（" + r.status + "）" + detail);
}

/* ---------- 掃描與顯示 ---------- */
function extractTrackId(text){
  let m = text.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/([A-Za-z0-9]{22})/);
  if(m) return m[1];
  m = text.match(/spotify:track:([A-Za-z0-9]{22})/);
  return m ? m[1] : null;
}

function play(text){
  const id = extractTrackId(text);
  if(!id){ msg("讀到的內容不是 Spotify 歌曲連結：" + text.slice(0,80)); return false; }
  msg("正在播放…");
  playTrack(id);
  const info = $("info"), s = SONGS[id];
  info.hidden = false;
  if(s){
    info.innerHTML = '<button id="reveal">揭曉年份</button><div id="ans" hidden>' +
      s.title + '／' + s.artist + '／<b>' + s.year + '</b></div>';
    $("reveal").onclick = () => $("ans").hidden = false;
  } else {
    info.textContent = "這首歌還沒登錄在歌單裡（曲目 ID：" + id + "）";
  }
  $("scanBtn").textContent = "掃描下一張";
  return true;
}

$("playBtn").onclick = () => play($("link").value.trim());

let stream = null, scanning = false;
$("scanBtn").onclick = async () => {
  if(scanning) return;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  }catch(e){
    msg("無法開啟鏡頭（" + e.name + "）。請確認網址是 https 並允許鏡頭權限。");
    return;
  }
  const v = $("video");
  v.srcObject = stream; v.style.display = "block";
  await v.play();
  scanning = true; msg("請把 QR code 對準鏡頭…");
  const c = $("canvas"), ctx = c.getContext("2d", {willReadFrequently:true});
  const tick = () => {
    if(!scanning) return;
    if(v.readyState === v.HAVE_ENOUGH_DATA){
      c.width = v.videoWidth; c.height = v.videoHeight;
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const code = jsQR(img.data, img.width, img.height);
      if(code && code.data && play(code.data)){
        scanning = false;
        stream.getTracks().forEach(t => t.stop());
        v.style.display = "none";
        return;
      }
    }
    requestAnimationFrame(tick);
  };
  tick();
};

(async () => { await handleRedirect(); renderAuth(); })();
</script>
</body>
</html>
